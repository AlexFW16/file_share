<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloading PDF...</title>
<meta http-equiv="refresh" content="1; url=compressed-public-sustainability-report.pdf">
<style>body{font-family:system-ui,sans-serif;max-width:700px;margin:40px auto;padding:0 20px;text-align:center} a{color:#0969da} #status{margin:20px 0;color:#555} .spinner{border:3px solid #eee;border-top:3px solid #0969da;border-radius:50%;width:24px;height:24px;animation:spin 1s linear infinite;margin:20px auto}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
</head>
<body>
<h1>Downloading PDF...</h1>
<div class="spinner"></div>
<p id="status">Starting download...</p>
<p><a id="manual" href="compressed-public-sustainability-report.pdf" download>Click here if download doesn't start</a></p>
<p style="margin-top:40px;font-size:14px;color:#888"><a href="https://github.com/AlexFW16/file_share">View on GitHub</a> • Direct: <code>compressed-public-sustainability-report.pdf</code> (46 MB)</p>
<script>
(function(){
  const pdf = 'compressed-public-sustainability-report.pdf';
  const status = document.getElementById('status');
  status.textContent = 'Downloading ' + pdf + ' — 46 MB';
  // Trigger download attribute immediately (forces Save dialog)
  const a = document.createElement('a');
  a.href = pdf;
  a.download = pdf;
  document.body.appendChild(a);
  a.click();
  // Fallback navigate after 500ms if browser blocks download attribute
  setTimeout(()=>{ window.location.href = pdf; }, 600);
})();
</script>
</body>
</html>
